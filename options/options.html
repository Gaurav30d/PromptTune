<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptTune Settings</title>
    <link rel="stylesheet" href="../popup/popup.css">
    <style>
        body {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: var(--bg-color);
        }

        .save-msg {
            color: #4ade80;
            font-size: 13px;
            margin-top: 8px;
            display: block;
            height: 20px;
        }

        input[type="password"] {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-family: inherit;
            transition: border-color 0.2s;
            margin-top: 8px;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .description {
            color: var(--text-muted);
            margin-bottom: 24px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container" style="padding: 0;">
        <header style="border:none; padding:0; margin-bottom: 24px;">
            <div class="logo">
                <img src="../assets/icon48.png" alt="Logo" width="32" height="32">
                <h1 style="font-size: 24px;">PromptTune Settings</h1>
            </div>
        </header>

        <main>
            <div class="input-group">
                <label for="api-key">Gemini API Key</label>
                <p class="description">
                    Your key is stored locally in your browser. Get a key from <a
                        href="https://aistudio.google.com/app/apikey" target="_blank"
                        style="color: var(--primary);">Google AI Studio</a>.
                </p>
                <input type="password" id="api-key" placeholder="Paste your API Key here">
            </div>

            <div class="input-group" style="margin-bottom: 24px;">
                <label for="model-name">AI Model Name</label>
                <p class="description">
                    Specify the model (e.g., <code>gemini-2.5-flash</code>, <code>gemini-1.5-pro</code>).
                </p>
                <input type="text" id="model-name" placeholder="gemini-2.5-flash"
                    style="width: 100%; background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text-main); margin-top: 8px;">
            </div>

            <button id="save-btn" class="primary-btn" style="width: auto; align-self: flex-start; padding: 10px 24px;">
                Save Settings
            </button>

            <span id="status-msg" class="save-msg"></span>
        </main>
    </div>
    <script src="options.js"></script>
</body>

</html>
